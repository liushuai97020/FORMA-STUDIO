<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Casa Mar — FORMA</title>
    <meta
      name="description"
      content="Casa Mar — 临崖海滨住宅。一座向大西洋层层展开的住宅：白色体量、橡木格栅与无边际泳池，让建筑与海平线彼此消融。FORMA 实时建筑模型。"
    />
    <meta name="theme-color" content="#F2ECE3" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="experience">
      <!-- Full-window WebGL maquette. The canvas is decorative; the overlay carries the content. -->
      <canvas id="stage" aria-hidden="true"></canvas>

      <!-- Warm coastal haze: top wash, bottom scrim, fine grain. Purely atmospheric. -->
      <div class="atmosphere" aria-hidden="true">
        <div class="atmosphere__wash"></div>
        <div class="atmosphere__scrim"></div>
        <div class="atmosphere__grain"></div>
      </div>

      <main class="ui">
        <header class="masthead reveal" style="--reveal: 90ms">
          <span class="masthead__mark" aria-hidden="true">
            <svg viewBox="0 0 22 22" fill="none">
              <circle cx="11" cy="11" r="7.4" stroke="currentColor" stroke-width="0.8" opacity="0.5" />
              <path d="M0.8 11H21.2" stroke="currentColor" stroke-width="0.8" opacity="0.8" />
              <circle cx="11" cy="11" r="1.6" fill="currentColor" />
            </svg>
          </span>
          <p class="masthead__label">
            <span class="masthead__index">01</span>
            <span class="masthead__slash" aria-hidden="true">/</span>
            <span class="masthead__name">Casa Mar</span>
            <span class="masthead__slash" aria-hidden="true">/</span>
            <span class="masthead__cn">建筑</span>
            <span class="masthead__en">Architecture</span>
          </p>
        </header>

        <div class="bottom">
          <section class="colophon" aria-labelledby="project-title">
            <h1 id="project-title" class="title reveal" style="--reveal: 260ms">
              Casa <em>Mar</em>
            </h1>

            <div class="subtitle reveal" style="--reveal: 400ms">
              <p class="subtitle__cn">临崖海滨住宅</p>
              <p class="subtitle__en">Cliffside beach residence</p>
            </div>

            <p class="meta reveal" style="--reveal: 480ms">
              <span class="meta__item"><span class="meta__key">地点</span>葡萄牙 · 孔波尔塔</span>
              <span class="meta__dot" aria-hidden="true"></span>
              <span class="meta__item"><span class="meta__key">类型</span>住宅 · 海岸</span>
              <span class="meta__dot" aria-hidden="true"></span>
              <span class="meta__item"><span class="meta__key">面积</span>420 m²</span>
              <span class="meta__dot" aria-hidden="true"></span>
              <span class="meta__item"><span class="meta__key">年份</span>2026</span>
            </p>
          </section>

          <div class="controls reveal" style="--reveal: 560ms">
            <p class="cue">
              <span class="cue__glyph" aria-hidden="true">
                <svg viewBox="0 0 26 18" fill="none">
                  <path d="M2 9h22" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" />
                  <path d="M6.5 4.5 2 9l4.5 4.5" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M19.5 4.5 24 9l-4.5 4.5" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="13" cy="9" r="1.3" fill="currentColor" />
                </svg>
              </span>
              <span class="cue__copy">
                <span class="cue__cn">拖动环视 <span class="cue__dash" aria-hidden="true">—</span> 页面滚动</span>
                <span class="cue__en">Drag to orbit · Scroll page</span>
              </span>
            </p>

            <button
              id="light-toggle"
              class="light-toggle"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="在日间与黄昏之间切换"
            >
              <span class="light-toggle__label" data-mode-label="day">日间</span>
              <span class="light-toggle__track" aria-hidden="true">
                <span class="light-toggle__knob"></span>
              </span>
              <span class="light-toggle__label" data-mode-label="dusk">黄昏</span>
            </button>
          </div>
        </div>
      </main>

      <p class="sr-only">
        Casa Mar，临崖海滨住宅，位于葡萄牙孔波尔塔。两座向内海层层退台的白墙体量朝向大西洋，
        深挑檐下是橡木格栅与整面落地玻璃。石材露台、无边际泳池、沙丘草与棕榈树共同围合出海平线。
        这是一件实时建筑模型：拖动画面可以环视建筑，使用日间与黄昏开关改变光线；页面滚动不受干扰。
      </p>
    </div>

    <noscript>
      <p class="no-script">Casa Mar 需要启用 JavaScript 与 WebGL 才能呈现。</p>
    </noscript>

    <!-- Reveal the editorial overlay even if the module cannot load. -->
    <script>
      window.setTimeout(function () {
        document.body.classList.add('is-ready');
      }, 2600);
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
